name: ${WOA_PROJECT_NAME:-woa-odoo-single-node}

services:
  db:
    image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD_FILE: /run/woa-input/db-password
    volumes:
      - database:/var/lib/postgresql/data
      - ${WOA_PRIVATE_DIR:-../../.private/odoo-single-node}/db-password:/run/woa-input/db-password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  odoo:
    build:
      context: ../..
      dockerfile: deploy/odoo-single-node/Dockerfile.odoo
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      WOA_AGENT_REVOKE_URL: http://agent:8767/internal/revoke
    volumes:
      - odoo-data:/var/lib/odoo
      - ../../examples/odoo/deploy/addons:/mnt/extra-addons:ro
      - ${WOA_PRIVATE_DIR:-../../.private/odoo-single-node}/db-password:/run/woa-input/db-password:ro
      - ${WOA_PRIVATE_DIR:-../../.private/odoo-single-node}/session-secret:/run/woa-input/session-secret:ro
      - ${WOA_PRIVATE_DIR:-../../.private/odoo-single-node}/odoo.conf:/run/woa-input/odoo.conf:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  odoo-init:
    profiles: ["setup"]
    build:
      context: ../..
      dockerfile: deploy/odoo-single-node/Dockerfile.odoo
    depends_on:
      db:
        condition: service_healthy
    environment:
      WOA_ODOO_DATABASE: ${WOA_ODOO_DATABASE:-woa_trial}
    volumes:
      - odoo-data:/var/lib/odoo
      - ../../examples/odoo/deploy/addons:/mnt/extra-addons:ro
      - ${WOA_PRIVATE_DIR:-../../.private/odoo-single-node}/db-password:/run/woa-input/db-password:ro
      - ${WOA_PRIVATE_DIR:-../../.private/odoo-single-node}/session-secret:/run/woa-input/session-secret:ro
      - ${WOA_PRIVATE_DIR:-../../.private/odoo-single-node}/odoo.conf:/run/woa-input/odoo.conf:ro
      - ${WOA_PRIVATE_DIR:-../../.private/odoo-single-node}/odoo-admin-login-password:/run/woa-input/odoo-admin-login-password:ro
    entrypoint: ["/usr/local/bin/init-woa-odoo"]

  odoo-qualification-users:
    profiles: ["qualification"]
    build:
      context: ../..
      dockerfile: deploy/odoo-single-node/Dockerfile.odoo
    depends_on:
      odoo:
        condition: service_healthy
    environment:
      WOA_QUALIFICATION: "1"
    volumes:
      - odoo-data:/var/lib/odoo
      - ../../examples/odoo/deploy/addons:/mnt/extra-addons:ro
      - ${WOA_PRIVATE_DIR:-../../.private/odoo-single-node}/db-password:/run/woa-input/db-password:ro
      - ${WOA_PRIVATE_DIR:-../../.private/odoo-single-node}/session-secret:/run/woa-input/session-secret:ro
      - ${WOA_PRIVATE_DIR:-../../.private/odoo-single-node}/odoo.conf:/run/woa-input/odoo.conf:ro
      - ${WOA_PRIVATE_DIR:-../../.private/odoo-single-node}/writer-login-password:/run/woa-input/writer-login-password:ro
      - ${WOA_PRIVATE_DIR:-../../.private/odoo-single-node}/reader-login-password:/run/woa-input/reader-login-password:ro
      - ${WOA_PRIVATE_DIR:-../../.private/odoo-single-node}:/run/woa-output
    entrypoint: ["/usr/local/bin/woa-qualification-users"]

  agent:
    build:
      context: ../..
      dockerfile: deploy/odoo-single-node/Dockerfile.agent
      args:
        WOA_BUILD_REVISION: ${WOA_BUILD_REVISION:-unversioned}
    depends_on:
      odoo:
        condition: service_healthy
    environment:
      WOA_ODOO_RPC_URL: http://odoo:8069
      WOA_PUBLIC_ORIGIN: ${WOA_PUBLIC_ORIGIN:-https://localhost:8443}
      WOA_SCRIPTED: ${WOA_SCRIPTED:-0}
      WOA_ALLOW_MUTATIONS: ${WOA_ALLOW_MUTATIONS:-0}
      WOA_HOSTNAME: ${WOA_HOSTNAME:-localhost}
      WOA_OTEL_EXPORTER_OTLP_ENDPOINT: ${WOA_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      WOA_ALERT_WEBHOOK_URL: ${WOA_ALERT_WEBHOOK_URL:-}
      WOA_COST_ALERT_CNY: ${WOA_COST_ALERT_CNY:-}
    volumes:
      - agent-state:/var/lib/woa
      - ${WOA_PRIVATE_DIR:-../../.private/odoo-single-node}:/run/woa-input:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "127.0.0.1:${WOA_HTTPS_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8767/healthz', timeout=3); urllib.request.urlopen('http://127.0.0.1:8766/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  database:
  odoo-data:
  agent-state:
  caddy-data:
  caddy-config:
