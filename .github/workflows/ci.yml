name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: evals/pageagent/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: python -m pip install --editable .
      - name: Install pinned PageAgent baseline
        working-directory: evals/pageagent
        run: npm ci
      - name: Verify deterministic PageAgent baseline bundle
        working-directory: evals/pageagent
        run: npm test
      - name: Build pinned PageAgent baseline bundle
        working-directory: evals/pageagent
        run: npm run build
      - name: Install Chromium for PageAgent qualification
        run: python -m playwright install --with-deps chromium
      - name: Qualify
        env:
          WOA_REQUIRE_PAGEAGENT_BROWSER: "1"
        run: scripts/qualify.sh --require-browser
