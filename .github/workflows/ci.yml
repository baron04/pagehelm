name: CI

# Actions are pinned to reviewed commit SHAs, not to floating tags. A tag is a mutable
# pointer: `@v4` today and `@v4` next month can be different code with the same name, and
# this workflow installs dependencies and runs the qualification. The trailing comment is
# the tag each SHA was resolved from, so a person can tell what they are looking at.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Both interpreters the distributions accept. A range that only one of them is ever run
    # on is a claim, not a fact; `test_supported_python.py` keeps this list and the metadata
    # from drifting apart.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            evals/pageagent/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          python -m pip install --editable .
          python -m pip install --no-deps --editable examples/ofbiz
          python -m pip install --no-deps --editable examples/twenty
          python -m pip install --no-deps --editable examples/odoo
      - name: Install pinned PageAgent baseline
        working-directory: evals/pageagent
        run: npm ci
      - name: Install the assistant panel toolchain
        working-directory: frontend
        run: npm ci
      - name: Install Chromium for PageAgent qualification
        run: python -m playwright install --with-deps chromium
      - name: Qualify
        env:
          WOA_REQUIRE_PAGEAGENT_BROWSER: "1"
        run: scripts/qualify.sh --require-browser
