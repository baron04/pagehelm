<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'; base-uri 'none'; form-action 'none'">
  <title>__WOA_PRODUCT_NAME__ · 可验证执行轨迹</title>
  <style>
    :root {
      --paper: #eef3f8;
      --sheet: #f8fbfd;
      --ink: #12243a;
      --muted: #66778b;
      --line: #ccd8e4;
      --blue: #145da0;
      --cyan: #0e8796;
      --amber: #d67627;
      --red: #b64955;
      --green: #19735a;
      --shadow: 0 18px 48px rgba(30, 55, 82, .14);
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background:
      linear-gradient(rgba(68, 107, 141, .055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(68, 107, 141, .055) 1px, transparent 1px), var(--paper);
      background-size: 28px 28px; font: 15px/1.55 "Avenir Next", Avenir, "Segoe UI", sans-serif; }
    button { font: inherit; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: minmax(250px, 330px) 1fr; }
    .shell > aside { padding: 34px 24px; background: rgba(18, 36, 58, .97); color: #f0f6fb;
      box-shadow: 8px 0 32px rgba(18, 36, 58, .12); }
    .mark { display: flex; align-items: center; gap: 10px; margin-bottom: 42px;
      font: 700 12px/1 "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
      letter-spacing: .14em; text-transform: uppercase; }
    .mark::before { content: ""; width: 22px; height: 22px; border: 2px solid #76ced7;
      border-radius: 50%; box-shadow: inset 0 0 0 5px var(--ink); background: #76ced7; }
    .shell > aside h2 { margin: 0 0 8px; font: 600 clamp(25px, 3vw, 37px)/1.05 Georgia, serif;
      letter-spacing: -.025em; }
    .shell > aside > p { margin: 0 0 28px; color: #aebdcb; max-width: 29ch; }
    .case-list { display: grid; gap: 9px; }
    .case { width: 100%; border: 1px solid rgba(204, 216, 228, .2); border-radius: 10px;
      padding: 12px 13px; text-align: left; color: inherit; background: rgba(255,255,255,.035);
      cursor: pointer; transition: border-color .18s ease, background .18s ease, transform .18s ease; }
    .case:hover { transform: translateX(3px); border-color: rgba(118, 206, 215, .62); }
    .case:focus-visible, .control:focus-visible { outline: 3px solid #76ced7; outline-offset: 2px; }
    .case[aria-current="true"] { border-color: #76ced7; background: rgba(118, 206, 215, .14); }
    .case small { display: block; margin-top: 3px; color: #9fb1c2;
      font: 11px/1.4 "IBM Plex Mono", "SFMono-Regular", Consolas, monospace; }
    .case-state { float: right; margin-left: 10px; color: #75dab9; font-size: 12px; }
    .case-state.fail { color: #ff9c9f; }
    main { padding: clamp(28px, 5vw, 72px); min-width: 0; }
    .eyebrow { margin: 0 0 12px; color: var(--blue); font: 700 11px/1.3 "IBM Plex Mono",
      "SFMono-Regular", Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; }
    h1 { max-width: 820px; margin: 0; font: 500 clamp(40px, 6vw, 78px)/.98 Georgia, serif;
      letter-spacing: -.045em; text-wrap: balance; }
    .lede { max-width: 690px; margin: 22px 0 32px; color: var(--muted); font-size: 17px; }
    .scoreboard { display: grid; grid-template-columns: repeat(5, minmax(100px, 1fr)); gap: 1px;
      border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--line);
      box-shadow: var(--shadow); }
    .score { min-height: 90px; padding: 15px; background: var(--sheet); }
    .score b { display: block; font: 600 25px/1.1 Georgia, serif; }
    .score span { color: var(--muted); font: 10px/1.3 "IBM Plex Mono", "SFMono-Regular",
      Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; }
    .score.result b { color: var(--green); }
    .score.result.fail b { color: var(--red); }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(230px, 320px);
      gap: clamp(24px, 4vw, 54px); margin-top: 42px; align-items: start; }
    .trace-head { display: flex; justify-content: space-between; align-items: end; gap: 20px;
      margin-bottom: 18px; }
    .trace-head h2 { margin: 0; font: 600 25px/1.1 Georgia, serif; }
    .controls { display: flex; gap: 8px; }
    .control { border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px;
      color: var(--ink); background: var(--sheet); cursor: pointer; }
    .control.primary { color: white; border-color: var(--blue); background: var(--blue); }
    .rail { position: relative; margin: 0; padding: 5px 0 0 0; list-style: none; }
    .rail::before { content: ""; position: absolute; top: 16px; bottom: 20px; left: 75px;
      width: 2px; background: var(--line); }
    .event { position: relative; display: grid; grid-template-columns: 58px 18px minmax(0, 1fr);
      gap: 10px; padding: 0 0 21px; opacity: .34; transform: translateY(3px);
      transition: opacity .22s ease, transform .22s ease; }
    .event.visible { opacity: 1; transform: none; }
    .event time { padding-top: 1px; color: var(--muted); text-align: right;
      font: 10px/1.5 "IBM Plex Mono", "SFMono-Regular", Consolas, monospace; }
    .node { position: relative; z-index: 1; width: 12px; height: 12px; margin-top: 3px;
      border: 3px solid var(--paper); border-radius: 50%; background: var(--blue);
      box-shadow: 0 0 0 1px var(--blue); }
    .event[data-tone="knowledge"] .node { background: var(--cyan); box-shadow: 0 0 0 1px var(--cyan); }
    .event[data-tone="approval"] .node { background: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
    .event[data-tone="guard"] .node { background: var(--red); box-shadow: 0 0 0 1px var(--red); }
    .event[data-tone="verify"] .node { background: var(--green); box-shadow: 0 0 0 1px var(--green); }
    .event article { min-width: 0; padding: 0 0 4px; }
    .event h3 { margin: 0 0 2px; font-size: 14px; line-height: 1.3; }
    .event p { margin: 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .event code { display: inline-block; margin-top: 6px; color: var(--blue);
      font: 10px/1.3 "IBM Plex Mono", "SFMono-Regular", Consolas, monospace; }
    .answer { position: sticky; top: 28px; border-top: 4px solid var(--ink); padding-top: 16px; }
    .answer h2 { margin: 0 0 8px; font: 600 21px/1.2 Georgia, serif; }
    .answer p { margin: 0 0 22px; color: var(--muted); }
    .proof { border: 1px solid var(--line); border-radius: 11px; padding: 15px;
      background: rgba(248, 251, 253, .75); }
    .proof dt { color: var(--muted); font: 10px/1.4 "IBM Plex Mono", "SFMono-Regular",
      Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; }
    .proof dd { margin: 2px 0 14px; overflow-wrap: anywhere; }
    .proof dd:last-child { margin-bottom: 0; }
    footer { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line);
      color: var(--muted); font-size: 12px; }
    @media (max-width: 900px) {
      .shell { display: block; }
      .shell > aside { padding: 24px; }
      .mark { margin-bottom: 22px; }
      .shell > aside h2, .shell > aside > p { display: none; }
      .case-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .workspace { grid-template-columns: 1fr; }
      .answer { position: static; }
      .scoreboard { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 560px) {
      main { padding: 28px 18px 40px; }
      .case-list { grid-template-columns: 1fr; }
      .scoreboard { grid-template-columns: repeat(2, 1fr); }
      .trace-head { align-items: start; flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="mark">Web Operation Agent</div>
      <h2>选择一条执行记录</h2>
      <p>每个决策、页面回执、授权和验证都来自已脱敏的回放数据。</p>
      <nav class="case-list" aria-label="产品执行记录"></nav>
    </aside>
    <main>
      <p class="eyebrow">ReAct flight recorder · observed evidence</p>
      <h1>每一步都留下证据。</h1>
      <p class="lede" id="task"></p>
      <section class="scoreboard" aria-label="执行摘要"></section>
      <div class="workspace">
        <section>
          <div class="trace-head">
            <div><p class="eyebrow">Observe → decide → act → verify</p><h2>执行轨迹</h2></div>
            <div class="controls">
              <button class="control" id="reset" type="button">重置</button>
              <button class="control primary" id="play" type="button">播放轨迹</button>
            </div>
          </div>
          <ol class="rail" aria-live="polite"></ol>
        </section>
        <aside class="answer">
          <p class="eyebrow">Verified response</p>
          <h2>Agent 回答</h2>
          <p id="answer"></p>
          <dl class="proof"></dl>
        </aside>
      </div>
      <footer>回放只显示已脱敏的 trace bundle。完成状态应来自确定性产品 verifier，而非模型自评。</footer>
    </main>
  </div>
  <script id="trace-data" type="application/json">__WOA_TRACE_BUNDLE__</script>
  <script id="trace-example" type="application/json">
    {
      "schema_version": 1,
      "product": "Web Operation Agent",
      "cases": [{
        "id": "safe-example",
        "label": "脱敏示例",
        "mode": "合成只读轨迹",
        "task": "查看只读页面操作如何经过执行和确定性验证。",
        "success": true,
        "summary": {
          "duration_s": 1.2,
          "model_calls": 1,
          "page_actions": 1,
          "cost_cny": 0,
          "permit_consumed": 0,
          "write_blocked": 0,
          "terminal_reason": "verified_example"
        },
        "answer": "已打开目标记录并完成只读验证。此轨迹为模板内置的合成示例，不包含真实会话、账号或业务数据。",
        "events": [{
          "seq": 1,
          "at_ms": 0,
          "kind": "tool_call",
          "tone": "decision",
          "title": "goto",
          "detail": "/records/example"
        }, {
          "seq": 2,
          "at_ms": 620,
          "kind": "action_receipt",
          "tone": "action",
          "title": "页面动作完成",
          "detail": "goto · /records/example"
        }, {
          "seq": 3,
          "at_ms": 1200,
          "kind": "product_verification",
          "tone": "verify",
          "title": "产品验证通过",
          "detail": "只读页面后置条件成立"
        }]
      }]
    }
  </script>
  <script>
    const rawTraceData = document.querySelector('#trace-data').textContent
    const isSourceTemplate = rawTraceData.trim().startsWith('__WOA_' + 'TRACE_BUNDLE__')
    const bundle = JSON.parse(isSourceTemplate
      ? document.querySelector('#trace-example').textContent
      : rawTraceData)
    document.title = `${bundle.product} · 可验证执行轨迹`
    const list = document.querySelector('.case-list')
    const rail = document.querySelector('.rail')
    const scores = document.querySelector('.scoreboard')
    const play = document.querySelector('#play')
    let active = bundle.cases[0]
    let timer = null
    let visible = Infinity

    const metric = (value, label, extra = '') => {
      const cell = document.createElement('div')
      cell.className = `score ${extra}`
      const strong = document.createElement('b'); strong.textContent = value
      const span = document.createElement('span'); span.textContent = label
      cell.append(strong, span); return cell
    }
    function show(index) {
      active = bundle.cases[index]
      clearInterval(timer); timer = null; play.textContent = '播放轨迹'
      document.querySelector('#task').textContent = active.task
      document.querySelector('#answer').textContent = active.answer
      scores.replaceChildren(
        metric(active.success ? 'PASS' : 'FAIL', '产品验证', `result ${active.success ? '' : 'fail'}`),
        metric(active.summary.page_actions, '页面动作'),
        metric(active.summary.model_calls, '模型调用'),
        metric(`¥${active.summary.cost_cny.toFixed(4)}`, '登记费用'),
        metric(`${active.summary.duration_s}s`, '墙钟时间'),
      )
      rail.replaceChildren(...active.events.map(event => {
        const item = document.createElement('li')
        item.className = 'event'; item.dataset.tone = event.tone
        const time = document.createElement('time'); time.textContent = `+${(event.at_ms / 1000).toFixed(1)}s`
        const node = document.createElement('i'); node.className = 'node'; node.setAttribute('aria-hidden', 'true')
        const article = document.createElement('article')
        const title = document.createElement('h3'); title.textContent = event.title
        const detail = document.createElement('p'); detail.textContent = event.detail
        const kind = document.createElement('code'); kind.textContent = `${String(event.seq).padStart(2, '0')} · ${event.kind}`
        article.append(title, detail, kind); item.append(time, node, article); return item
      }))
      const proof = document.querySelector('.proof')
      const rows = [
        ['执行模式', active.mode], ['终态', active.summary.terminal_reason],
        ['写许可消费', active.summary.permit_consumed], ['写入阻断', active.summary.write_blocked],
      ]
      proof.replaceChildren(...rows.flatMap(([term, value]) => {
        const dt = document.createElement('dt'); dt.textContent = term
        const dd = document.createElement('dd'); dd.textContent = value
        return [dt, dd]
      }))
      visible = Infinity; reveal()
      document.querySelectorAll('.case').forEach((button, i) =>
        button.setAttribute('aria-current', i === index ? 'true' : 'false'))
    }
    function reveal() {
      ;[...rail.children].forEach((item, index) => item.classList.toggle('visible', index < visible))
    }
    bundle.cases.forEach((item, index) => {
      const button = document.createElement('button'); button.type = 'button'; button.className = 'case'
      const state = document.createElement('span'); state.className = `case-state ${item.success ? '' : 'fail'}`
      state.textContent = item.success ? 'PASS' : 'FAIL'
      const title = document.createTextNode(item.label)
      const small = document.createElement('small'); small.textContent = item.mode
      button.append(state, title, small); button.addEventListener('click', () => show(index)); list.appendChild(button)
    })
    play.addEventListener('click', () => {
      if (timer) { clearInterval(timer); timer = null; play.textContent = '继续播放'; return }
      if (visible >= active.events.length) visible = 0
      play.textContent = '暂停'
      reveal()
      timer = setInterval(() => {
        visible += 1; reveal()
        if (visible >= active.events.length) { clearInterval(timer); timer = null; play.textContent = '重新播放' }
      }, 420)
    })
    document.querySelector('#reset').addEventListener('click', () => {
      clearInterval(timer); timer = null; visible = Infinity; play.textContent = '播放轨迹'; reveal()
    })
    show(0)
  </script>
</body>
</html>
