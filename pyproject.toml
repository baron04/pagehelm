[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "web-operation-agent"
dynamic = ["version"]
description = "A server-side web operation agent with a thin browser runtime"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  # The browser contract is qualified on Playwright 1.52.0. Keep installations
  # within that minor line until a newer runtime is exercised by the test suite.
  "playwright>=1.52,<1.53",
]

[project.optional-dependencies]
# The minimal demo deliberately adds no application framework or database.  Keeping a named
# extra gives users a stable installation command while the demo remains self-contained.
demo = []

[project.scripts]
web-operation-agent-demo = "web_operation_agent_demo.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "web_operation_agent.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["web_operation_agent.tests*"]

[tool.setuptools.package-data]
web_operation_agent = [
  "policies/*.json",
  "web_runtime/*.html",
  "web_runtime/*.js",
]
web_operation_agent_demo = [
  "assets/*.js",
]
