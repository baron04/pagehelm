[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "web-operation-agent"
dynamic = ["version"]
description = "A server-side web operation agent with a thin browser runtime"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.23,<5",
  # The browser contract is qualified on Playwright 1.52.0. Keep installations
  # within that minor line until a newer runtime is exercised by the test suite.
  "playwright>=1.52,<1.53",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "web_operation_agent.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["web_operation_agent.tests*"]

[tool.setuptools.package-data]
web_operation_agent = [
  "policies/*.json",
  "web_runtime/*.html",
  # assistant.js -- the Runtime and the panel in one file -- is generated by
  # scripts/build_runtime.py from frontend/, never committed; a wheel built without it is
  # refused by check_wheel_contents.py.
  "web_runtime/*.js",
  # The panel contract and the palette: the server reads both, so they ship with it.
  "web_runtime/*.json",
]
