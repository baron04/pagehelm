[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "web-operation-agent-odoo"
dynamic = ["version"]
description = "Odoo 18 application adapter, route grammar, source compiler and Business Skills for web-operation-agent"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "web-operation-agent",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "web_operation_agent_odoo.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
# `deploy` provisions the local reference fixture and only works from a checkout: it
# reads a Compose file and an addon that live beside the example, not in the package.
# A wheel carrying it would ship a fixture master password as if it were product code.
exclude = ["web_operation_agent_odoo.tests*", "web_operation_agent_odoo.deploy*"]

[tool.setuptools.package-data]
web_operation_agent_odoo = [
  "policies/*.json",
  "skills/*/SKILL.md",
  "skills/*/agents/*.toml",
  "skills/*/references/*.json",
  "conventions/*.json",
]
