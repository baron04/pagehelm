; Odoo configuration for the reference fixture. Loopback only: the ports in
; docker-compose.yml bind 127.0.0.1, and the master password below is a fixture password,
; not a secret. Nothing here is suitable for a host anyone else can reach.
[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
admin_passwd = woa-reference-fixture
; The provisioning step creates the database itself, so the manager stays reachable.
list_db = True
; One worker: the fixture is driven by one gate at a time, and multi-worker Odoo makes a
; restored database keep serving from another worker's cache.
workers = 0
