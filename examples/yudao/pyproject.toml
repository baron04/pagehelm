[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "web-operation-agent-yudao"
dynamic = ["version"]
description = "yudao (ruoyi-vue-pro) goal data for web-operation-agent"
readme = "deploy/README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "web-operation-agent",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "web_operation_agent_yudao.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["web_operation_agent_yudao.tests*"]

[tool.setuptools.package-data]
web_operation_agent_yudao = ["conventions/*.json", "policies/*.json", "domain_playbooks/*.md", "skills/*/SKILL.md", "skills/*/agents/*.toml", "skills/*/references/*.md", "skill_references/*.md"]
