server {
    listen 80;
    client_max_body_size 20m;

    # The pinned PageController the assistant's Runtime imports, same-origin.
    location /woa/ {
        alias /usr/share/nginx/woa/;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API, API docs and websocket go to the Spring Boot server.
    location ~ ^/(admin-api|app-api|v3/api-docs|doc\.html|webjars|swagger-ui|swagger-resources|infra/ws)(/|$) {
        proxy_pass http://server:48080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
