# Local yudao (ruoyi-vue-pro) test application. Built artifacts and the pinned
# checkouts live outside Git; see README.md in this directory.
name: woa-yudao

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ruoyi-vue-pro
      MYSQL_ROOT_PASSWORD: ${YUDAO_DB_PASSWORD:-yudao-local-only}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--lower-case-table-names=1"]
    volumes:
      - mysql:/var/lib/mysql
      - ${YUDAO_CACHE}/server/sql/mysql/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/01-ruoyi-vue-pro.sql:ro
      - ${YUDAO_CACHE}/server/sql/mysql/quartz.sql:/docker-entrypoint-initdb.d/02-quartz.sql:ro
      - ${YUDAO_CACHE}/business-schema.sql:/docker-entrypoint-initdb.d/03-business-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${YUDAO_DB_PASSWORD:-yudao-local-only}"]
      interval: 5s
      retries: 60
    ports: ["127.0.0.1:43306:3306"]

  redis:
    image: redis:latest
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  server:
    image: eclipse-temurin:21-jre
    working_dir: /app
    volumes:
      - ${YUDAO_CACHE}/server/yudao-server/target/yudao-server.jar:/app/app.jar:ro
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${YUDAO_JAVA_OPTS:--Xms512m -Xmx1536m}
      YUDAO_SERVER_ARGS: ${YUDAO_SERVER_ARGS:-}
    command:
      - sh
      - -c
      - >-
        exec java $$JAVA_OPTS -jar app.jar
        --spring.datasource.dynamic.datasource.master.url='jdbc:mysql://mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true'
        --spring.datasource.dynamic.datasource.master.password=${YUDAO_DB_PASSWORD:-yudao-local-only}
        --spring.datasource.dynamic.datasource.slave.url='jdbc:mysql://mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true'
        --spring.datasource.dynamic.datasource.slave.password=${YUDAO_DB_PASSWORD:-yudao-local-only}
        --spring.data.redis.host=redis
        $$YUDAO_SERVER_ARGS
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    image: nginx:alpine
    volumes:
      - ${YUDAO_CACHE}/ui/dist-prod:/usr/share/nginx/html:ro
      # The pinned PageController the assistant's Runtime imports, same-origin.
      - ${YUDAO_CACHE}/woa:/usr/share/nginx/woa:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:48088:80"]
    depends_on: [server]

volumes:
  mysql:
