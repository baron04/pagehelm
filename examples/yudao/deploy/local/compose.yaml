# Two project-isolated synthetic environments; only the assistant ingress is published.
services:
  mysql:
    cpus: 3
    ports: !reset []
    mem_limit: 1024m
    memswap_limit: 1024m
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--lower-case-table-names=1", "--innodb-buffer-pool-size=128M", "--performance-schema=OFF", "--max-connections=60"]
  redis:
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
  server:
    cpus: 4
    environment:
      JAVA_OPTS: ${YUDAO_JAVA_OPTS:--Xms256m -Xmx1280m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Xss512k}
    mem_limit: 2048m
    memswap_limit: 2048m
  web:
    cpus: 0.25
    ports: !reset []
    mem_limit: 128m
    memswap_limit: 128m
  agent:
    cpus: 0.5
    build:
      context: ${LOCAL_CHECKOUT}
      dockerfile: examples/yudao/deploy/local/agent.Dockerfile
    image: ${LOCAL_AGENT_IMAGE}
    user: "${LOCAL_UID}:${LOCAL_GID}"
    env_file:
      - path: ${LOCAL_AGENT_ENV_FILE}
        required: false
        format: raw
    environment:
      HOME: /tmp
      WOA_LOCAL_ENVIRONMENT: ${LOCAL_ENVIRONMENT}
      WOA_LOCAL_PUBLIC_ORIGIN: ${LOCAL_PUBLIC_ORIGIN}
      WOA_LOCAL_CHECKOUT_ID: ${LOCAL_CHECKOUT_ID}
      NO_PROXY: localhost,127.0.0.1,::1,web,server,mysql,redis,host.docker.internal
      no_proxy: localhost,127.0.0.1,::1,web,server,mysql,redis,host.docker.internal
    labels:
      org.web-operation-agent.checkout: ${LOCAL_CHECKOUT_ID}
      org.web-operation-agent.environment: ${LOCAL_ENVIRONMENT}
    ports: ["127.0.0.1:${LOCAL_PUBLIC_PORT}:48163"]
    networks: [default, ingress]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [web]
    mem_limit: 512m
    memswap_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
networks:
  default:
    internal: true
  ingress: {}
