# Optional native-operation ingress. Include inside the HTTPS server only when the
# assistant host runs with a reviewed --native-read-policy and port 48093 is published
# on loopback. ^~ prevents the ordinary API regex from bypassing this admission fence.
# Include nginx.native-facts.filter.conf separately INSIDE the existing location /.
# That location already declares sub_filter and does not inherit server-level filters.

location ^~ /admin-api/ {
    proxy_pass http://127.0.0.1:48093;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
}

location ^~ /woa/page-guard/ {
    proxy_pass http://127.0.0.1:48093;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
}

# Only the admin HTTP API is qualified by this integration. Alternative ingress must
# not bypass the fence on the native-operation browser origin.
location ^~ /app-api/ { return 403; }
location ^~ /infra/ws { return 403; }
