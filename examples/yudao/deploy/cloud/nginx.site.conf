# __DOMAIN__ on the host's nginx: the UI and the assistant's pinned PageController from the
# current release, the API proxied to the server container on 127.0.0.1:48080. API docs,
# Swagger and actuator are not exposed. Certificates are certbot's, renewed by its timer.
# A same-origin request carries no Origin header on GET; the assistant's gateway requires one.
# Such a request is the site's own, so it is given the site's origin; a request that names
# another origin keeps it, and the gateway refuses it. Sessions authenticate by a bearer
# token, not a cookie, so no other site's page can use them.
map $http_origin $woa_origin {
    ""      "https://__DOMAIN__";
    default $http_origin;
}

server {
    listen 80;
    server_name __DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;  # nginx 1.24 (Ubuntu 24.04) has no `http2 on`
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 20m;
    root /opt/yudao/current/ui;

    location /woa/ {
        alias /opt/yudao/current/woa/;
        # Revalidate integration scripts via ETag/304 while preserving server-level add_header inheritance.
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # The assistant's loader, on every page of the admin UI.
        sub_filter '</head>' '<script src="/woa/yudao-loader.js"></script></head>';
        sub_filter_once on;
    }

    # The assistant: its runtime and sessions (the gateway), and the bootstrap that takes the
    # signed-in person's token to open their session.
    location /woa-agent/ {
        proxy_pass http://127.0.0.1:48091/;
        proxy_set_header Host $host;
        proxy_set_header Origin $woa_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /woa-agent-boot/bootstrap {
        proxy_pass http://127.0.0.1:48092/bootstrap;
        proxy_set_header Host $host;
        proxy_set_header Origin $woa_origin;
        client_max_body_size 8k;
    }

    location ~ ^/(admin-api|app-api|infra/ws)(/|$) {
        proxy_pass http://127.0.0.1:48080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
